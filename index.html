<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>IT27 Placement Dashboard</h1>
        <p>Company-wise placement details</p>
    </header>


    <main class="container">
        <div class="search-container">
            <input
                type="text"
                id="companySearch"
                placeholder="Search company, student name or roll number..."
                autocomplete="off"
            >
        </div>

        <div class="company-grid" id="companyGrid">
            <!-- Company cards will be generated here -->
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
